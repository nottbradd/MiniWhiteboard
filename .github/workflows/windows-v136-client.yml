name: Frozen V1.3.6 Windows client acceptance
on:
  workflow_dispatch:
    inputs:
      package:
        description: Frozen package to check
        type: choice
        default: all
        options: [all, installer, portable]
      checks:
        description: Full acceptance or an unresolved GUI subset
        type: choice
        default: all
        options: [all, comparison, upgrade, visuals, editing, gestures, shortcuts, download, preflight, environment]
permissions:
  contents: read
  actions: read
jobs:
  client:
    if: inputs.checks != 'environment'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.package == 'installer' && '["installer"]' || inputs.package == 'portable' && '["portable"]' || '["installer","portable"]') }}
    runs-on: windows-11-arm
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      MINIWHITEBOARD_CLIENT_VISUALS_ONLY: ${{ inputs.checks == 'visuals' && '1' || '0' }}
      MINIWHITEBOARD_CLIENT_EDITING_ONLY: ${{ inputs.checks == 'editing' && '1' || '0' }}
      MINIWHITEBOARD_CLIENT_GESTURES_ONLY: ${{ inputs.checks == 'gestures' && '1' || '0' }}
      MINIWHITEBOARD_CLIENT_COMPARISON_ONLY: ${{ inputs.checks == 'comparison' && '1' || '0' }}
      MINIWHITEBOARD_CLIENT_UPGRADE_ONLY: ${{ inputs.checks == 'upgrade' && '1' || '0' }}
      MINIWHITEBOARD_CLIENT_SHORTCUTS_ONLY: ${{ inputs.checks == 'shortcuts' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        timeout-minutes: 5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install diagnostic tools
        timeout-minutes: 5
        run: python -m pip install -r requirements-dev.txt pywinauto==0.6.9 pillow==13.0.0
      - name: Prepare frozen application source and current diagnostic helpers
        run: |
          git fetch origin b4b9d276efb484512978449d216bfa4a253ef2d9
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git worktree add verification/client-source b4b9d276efb484512978449d216bfa4a253ef2d9
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in @('client_download_check.py','client_environment_check.py','client_glass_diagnostics.py','client_graphics_check.py','client_wizard_check.py','client_uia_check.py','creation_shortcut_check.py','defender_investigation.ps1','defender_runtime_check.py','early_release_probe.py','floating_tools_check.py','package_check.py','packaged_drawing_check.py','packaged_shortcut_check.py')) {
            Copy-Item -LiteralPath "scripts/$name" -Destination verification/client-source/scripts
          }
      - name: Record the initial client before setup
        timeout-minutes: 1
        run: python -m scripts.client_environment_check --observe verification/client-desktop/initial
      - name: Preserve the initial client before bounded setup
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: client-initial-${{ matrix.package }}
          path: verification/client-desktop/initial/
          if-no-files-found: error
          retention-days: 90
      - name: Complete normal WSL setup once on the disposable client
        timeout-minutes: 8
        run: python -m scripts.client_environment_check --setup verification/client-desktop/wsl-setup
      - name: Preserve the setup result before browser interaction
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: client-setup-${{ matrix.package }}
          path: verification/client-desktop/wsl-setup/
          if-no-files-found: warn
          retention-days: 90
      - name: Prepare the disposable client desktop
        timeout-minutes: 2
        run: python -m scripts.observed_process --directory verification/client-desktop/operation --label desktop --timeout 45 -- python -m scripts.client_download_check prepare --path verification/client-desktop --destination verification/client-desktop --output verification/client-desktop/ui
      - name: Harmless preflight with active Defender
        timeout-minutes: 8
        run: ./scripts/defender_investigation.ps1 -ClientPreflight -BrowserExplorer -EvidenceName client-preflight -WorkBudgetMinutes 5
      - name: Record graphics policy and source-only compositor diagnostics
        if: inputs.checks == 'all' || inputs.checks == 'comparison' || inputs.checks == 'visuals'
        timeout-minutes: 2
        run: |
          Push-Location verification/client-source
          try {
            python -m scripts.observed_process --directory ../client-desktop/graphics-operation --label graphics --timeout 55 -- python -m scripts.client_graphics_check --output ../client-desktop/graphics
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
      - name: Preserve readiness before downloading application bytes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: client-readiness-${{ matrix.package }}
          path: |
            verification/client-desktop/
            verification/client-preflight/
            !verification/client-preflight/browser-*/edge-profile/
          if-no-files-found: error
          retention-days: 90
      - name: Browser download, Explorer extraction and exact package GUI checks
        if: inputs.checks != 'preflight'
        timeout-minutes: 21
        env:
          CLIENT_PACKAGE: ${{ matrix.package }}
          CLIENT_CHECKS: ${{ inputs.checks }}
        run: |
          Push-Location verification/client-source
          try {
            $exercise = $env:CLIENT_CHECKS -ne 'download'
            & ./scripts/defender_investigation.ps1 -Exercise:$exercise -BrowserExplorer -Package $env:CLIENT_PACKAGE -CandidateBrowserArtifact 13569539601 -CandidateArtifactSha ec84483c67576cbd38fe74512459e78f5536041d94689a423e4c16d35268b1ab -WorkBudgetMinutes 18
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
      - name: Observe Protection history after the application checks
        if: always() && inputs.checks != 'preflight'
        timeout-minutes: 2
        shell: pwsh
        run: python -m scripts.observed_process --directory verification/client-desktop/security-history-operation --label security-history --timeout 60 python -m scripts.client_security_history --output verification/client-desktop/security-history
      - name: Preserve warnings, security observations and partial GUI results
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: client-candidate-${{ matrix.package }}
          path: |
            verification/defender-investigation/
            verification/client-desktop/
            !verification/defender-investigation/browser-*/edge-profile/
          if-no-files-found: warn
          retention-days: 90
  graphics-environment:
    if: inputs.checks == 'environment'
    runs-on: windows-11-arm
    timeout-minutes: 5
    steps:
      - name: Read graphics and desktop policy without GUI input or candidate execution
        timeout-minutes: 2
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path graphics-environment | Out-Null
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class ClientGraphicsProbe {
            [StructLayout(LayoutKind.Sequential)] public struct Power {
              public byte AC, BatteryFlag, BatteryPercent, SystemStatus;
              public uint BatterySeconds, FullSeconds;
            }
            [DllImport("user32.dll")] public static extern int GetSystemMetrics(int code);
            [DllImport("kernel32.dll")] public static extern bool GetSystemPowerStatus(out Power status);
            [DllImport("dwmapi.dll")] public static extern int DwmIsCompositionEnabled(out bool enabled);
          }
          '@
          $power = New-Object ClientGraphicsProbe+Power
          $powerRead = [ClientGraphicsProbe]::GetSystemPowerStatus([ref]$power)
          $composition = $false
          $dwmResult = [ClientGraphicsProbe]::DwmIsCompositionEnabled([ref]$composition)
          $result = @{
            scope='Read-only environment diagnosis; no input, application execution, settings changes or acceptance claim'
            utc=(Get-Date).ToUniversalTime().ToString('o')
            os=Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber,OSArchitecture
            processor=Get-CimInstance Win32_Processor | Select-Object Name,Architecture
            video=Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion,VideoProcessor,Status,AdapterCompatibility
            session=$env:SESSIONNAME
            remote_session_metric=[bool][ClientGraphicsProbe]::GetSystemMetrics(0x1000)
            transparency=Get-ItemPropertyValue -LiteralPath 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name EnableTransparency -ErrorAction SilentlyContinue
            power_read=$powerRead
            power=$power
            dwm_hresult=$dwmResult
            dwm_composition_enabled=$composition
            defender=Get-MpComputerStatus | Select-Object AMRunningMode,RealTimeProtectionEnabled,AMProductVersion,AMEngineVersion,AntivirusSignatureVersion
          }
          $result | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath graphics-environment/result.json -Encoding utf8
      - name: Preserve read-only environment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: client-graphics-environment
          path: graphics-environment/
          if-no-files-found: error
          retention-days: 90

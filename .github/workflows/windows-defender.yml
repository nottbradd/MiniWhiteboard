name: Windows Defender investigation

on:
  workflow_dispatch:
  push:
    branches: [codex/v1.3.5-defender-investigation]
    paths:
      - '.github/workflows/windows-defender.yml'
      - 'scripts/defender_investigation.ps1'
      - 'scripts/defender_runtime_check.py'

permissions:
  contents: read

jobs:
  published-downloads:
    strategy:
      fail-fast: false
      matrix:
        package: [installer, portable]
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install the test harness (the release runtime is not rebuilt)
        run: |
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inspect the published V1.3.4 HotkeyPatch with active Defender
        shell: pwsh
        env:
          INVESTIGATION_PACKAGE: ${{ matrix.package }}
        run: ./scripts/defender_investigation.ps1 -Exercise -Package $env:INVESTIGATION_PACKAGE
      - name: Preserve security observations even when blocked
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: defender-investigation-${{ matrix.package }}-${{ github.run_id }}
          path: verification/defender-investigation/
          if-no-files-found: error
          retention-days: 90

name: Windows Defender investigation

on:
  workflow_dispatch:
    inputs:
      package:
        description: Published package to investigate
        type: choice
        default: all
        options: [all, installer, portable]
      diagnostic:
        description: Focused portable experiment, or the established standard suites
        type: choice
        default: standard
        options: [standard, probe-smoke, reduce, source, notify, stale, pending, source-pending, early-default-fresh, early-default-full, early-custom-fresh, early-custom-full]

permissions:
  contents: read

jobs:
  published-downloads:
    strategy:
      fail-fast: false
      matrix:
        # Reuse completed evidence; explicitly choose the next diagnostic run.
        package: ${{ fromJSON(inputs.package == 'installer' && '["installer"]' || inputs.package == 'portable' && '["portable"]' || '["installer","portable"]') }}
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install the test harness (the release runtime is not rebuilt)
        run: |
          python -m pip install -r requirements-dev.txt pywinauto==0.6.9
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare and scan the published samples with active Defender
        timeout-minutes: 8
        shell: pwsh
        run: ./scripts/defender_investigation.ps1 -WorkBudgetMinutes 5
      - name: Upload the pre-execution checkpoint
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: defender-pre-execution-${{ matrix.package }}-${{ github.run_id }}
          path: verification/defender-investigation/
          if-no-files-found: error
          retention-days: 90
      - name: Inspect runtime using the same reverified published files
        timeout-minutes: 20
        shell: pwsh
        env:
          INVESTIGATION_PACKAGE: ${{ matrix.package }}
          INVESTIGATION_DIAGNOSTIC: ${{ inputs.diagnostic }}
        run: ./scripts/defender_investigation.ps1 -Exercise -Package $env:INVESTIGATION_PACKAGE -Diagnostic $env:INVESTIGATION_DIAGNOSTIC -ReuseSamples -EvidenceName defender-runtime -WorkBudgetMinutes 17
      - name: Preserve security observations even when blocked
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: defender-investigation-${{ matrix.package }}-${{ github.run_id }}
          path: |
            verification/defender-investigation/
            verification/defender-runtime/
          if-no-files-found: error
          retention-days: 90

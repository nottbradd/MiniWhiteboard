name: Windows Defender investigation

on:
  workflow_dispatch:
    inputs:
      package:
        description: Published package to investigate
        type: choice
        default: all
        options: [all, installer, portable]
  push:
    branches: [codex/v1.3.5-defender-investigation]
    paths:
      - '.github/workflows/windows-defender.yml'
      - 'scripts/defender_investigation.ps1'
      - 'scripts/defender_runtime_check.py'
      - 'scripts/observed_process.py'
      - 'scripts/packaged_shortcut_check.py'
      - 'scripts/profile_source_transition.py'

permissions:
  contents: read

jobs:
  published-downloads:
    strategy:
      fail-fast: false
      matrix:
        # Keep the completed installer evidence; branch pushes iterate the
        # portable timing diagnostic. Manual runs can select either or both.
        package: ${{ fromJSON(github.event_name == 'push' && '["portable"]' || inputs.package == 'installer' && '["installer"]' || inputs.package == 'portable' && '["portable"]' || '["installer","portable"]') }}
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install the test harness (the release runtime is not rebuilt)
        run: |
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare and scan the published samples with active Defender
        timeout-minutes: 8
        shell: pwsh
        run: ./scripts/defender_investigation.ps1 -WorkBudgetMinutes 5
      - name: Upload the pre-execution checkpoint
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: defender-pre-execution-${{ matrix.package }}-${{ github.run_id }}
          path: verification/defender-investigation/
          if-no-files-found: error
          retention-days: 90
      - name: Inspect runtime using the same reverified published files
        timeout-minutes: 16
        shell: pwsh
        env:
          INVESTIGATION_PACKAGE: ${{ matrix.package }}
        run: ./scripts/defender_investigation.ps1 -Exercise -Package $env:INVESTIGATION_PACKAGE -ReuseSamples -EvidenceName defender-runtime -WorkBudgetMinutes 12
      - name: Preserve security observations even when blocked
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: defender-investigation-${{ matrix.package }}-${{ github.run_id }}
          path: |
            verification/defender-investigation/
            verification/defender-runtime/
          if-no-files-found: error
          retention-days: 90

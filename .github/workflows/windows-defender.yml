name: Windows Defender investigation

on:
  workflow_dispatch:
  push:
    branches: [codex/v1.3.5-defender-investigation]
    paths:
      - '.github/workflows/windows-defender.yml'
      - 'scripts/defender_investigation.ps1'

permissions:
  contents: read

jobs:
  published-downloads:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Inspect the published V1.3.4 HotkeyPatch with active Defender
        shell: pwsh
        run: ./scripts/defender_investigation.ps1
      - name: Preserve security observations even when blocked
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: defender-investigation-${{ github.run_id }}
          path: verification/defender-investigation/
          if-no-files-found: error
          retention-days: 90

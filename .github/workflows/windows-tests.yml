name: Windows tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read

concurrency:
  group: windows-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run the complete automated suite
        run: |
          python -m scripts.run_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify native gestures with the explicit compatibility preset
        run: |
          python -m scripts.creation_shortcut_check --require-both
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the Windows application bundle
        run: |
          New-Item -ItemType Directory -Force verification/v134-review01 | Out-Null
          & .\build.ps1 -Python (Get-Command python).Source *> verification/v134-review01/windows-build.txt
          if ($LASTEXITCODE -ne 0) { Get-Content verification/v134-review01/windows-build.txt -Tail 50; exit $LASTEXITCODE }

      - name: Verify available defaults and custom shortcuts in the final executable
        run: |
          python -m scripts.packaged_shortcut_check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m scripts.packaged_shortcut_check --profile default --available-defaults --output verification/v134-review01/packaged-default
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m scripts.packaged_shortcut_check --profile custom --output verification/v134-review01/packaged-custom
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m scripts.package_check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package portable ZIP and per-user installer
        run: |
          python -m scripts.package_release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m scripts.bootstrap_inno
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m scripts.build_installer --compiler verification/tools/innosetup-6.7.3/compiler/ISCC.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload unpublished Windows candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: WinMiniWhiteboardV1.3.4-Review01
          path: |
            build/candidates/v1.3.4/review-01/WinMiniWhiteboardV1.3.4.zip
            build/candidates/v1.3.4/review-01/MiniWhiteboard-1.3.4-Setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload build verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-v1.3.4-review01-verification
          path: |
            verification/*.json
            verification/v134-review01/*.json
            verification/v134-review01/*.txt
            verification/v134-review01/*.png
            verification/v134-review01/packaged-shortcuts/
            verification/v134-review01/packaged-default/
            verification/v134-review01/packaged-custom/
            verification/v134-review01/package/
          if-no-files-found: warn
          retention-days: 30

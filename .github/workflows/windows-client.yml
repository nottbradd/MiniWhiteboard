name: Windows client download investigation

on:
  workflow_dispatch:
  push:
    branches: [codex/v1.3.5-defender-investigation]
    paths:
      - '.github/workflows/windows-client.yml'
      - 'scripts/client_download_check.py'

permissions:
  contents: read

jobs:
  client-download:
    strategy:
      fail-fast: false
      matrix:
        package: [installer, portable]
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install diagnostic tools only
        run: |
          python -m pip install -r requirements-dev.txt pywinauto==0.6.9 pillow==13.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test the unchanged primary package through the Windows client download path
        timeout-minutes: 24
        shell: pwsh
        env:
          INVESTIGATION_PACKAGE: ${{ matrix.package }}
        run: ./scripts/defender_investigation.ps1 -Exercise -BrowserExplorer -Package $env:INVESTIGATION_PACKAGE
      - name: Preserve observations and warnings
        if: always()
        timeout-minutes: 4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-client-${{ matrix.package }}-${{ github.run_id }}
          path: |
            verification/defender-investigation/
            !verification/defender-investigation/browser-*/edge-profile/
          if-no-files-found: error
          retention-days: 90

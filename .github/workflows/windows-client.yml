name: Windows client download investigation

on:
  workflow_dispatch:
    inputs:
      acceptance:
        description: Run one exact package only after preflight and its upload pass
        type: boolean
        default: false
      package:
        description: Package for a successful preflight environment
        type: choice
        options: [portable, installer]
        default: portable
  push:
    branches: [codex/v1.3.5-defender-investigation]
    paths:
      - '.github/workflows/windows-client.yml'
      - 'scripts/client_download_check.py'
      - 'scripts/package_check.py'

permissions:
  contents: read

jobs:
  client-download:
    runs-on: windows-11-arm
    timeout-minutes: ${{ inputs.acceptance && 38 || 15 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install diagnostic tools only
        run: |
          python -m pip install -r requirements-dev.txt pywinauto==0.6.9 pillow==13.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Establish desktop readiness before the security and download stages
        timeout-minutes: 2
        shell: pwsh
        run: |
          python -m scripts.observed_process --directory verification/client-desktop-checkpoint/operation --label client-desktop --timeout 45 -- python -m scripts.client_download_check prepare --path verification/client-desktop-checkpoint --destination verification/client-desktop-checkpoint --output verification/client-desktop-checkpoint/desktop
      - name: Upload the independent desktop checkpoint
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-client-desktop-${{ github.run_id }}
          path: verification/client-desktop-checkpoint/
          if-no-files-found: error
          retention-days: 90
      - name: Harmless browser and Explorer preflight with active Defender
        id: preflight
        timeout-minutes: 8
        shell: pwsh
        run: ./scripts/defender_investigation.ps1 -ClientPreflight -BrowserExplorer -EvidenceName client-preflight -WorkBudgetMinutes 5
      - name: Preserve the preflight before any application execution
        id: checkpoint
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-client-preflight-${{ github.run_id }}
          path: |
            verification/client-preflight/
            !verification/client-preflight/browser-*/edge-profile/
          if-no-files-found: error
          retention-days: 90
      - name: Test the unchanged primary package through the Windows client download path
        if: success() && inputs.acceptance && steps.preflight.outcome == 'success' && steps.checkpoint.outcome == 'success'
        timeout-minutes: 18
        shell: pwsh
        env:
          INVESTIGATION_PACKAGE: ${{ inputs.package }}
        run: ./scripts/defender_investigation.ps1 -Exercise -BrowserExplorer -Package $env:INVESTIGATION_PACKAGE -WorkBudgetMinutes 14
      - name: Preserve observations and warnings
        if: always() && inputs.acceptance && steps.preflight.outcome == 'success'
        timeout-minutes: 4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-client-${{ inputs.package }}-${{ github.run_id }}
          path: |
            verification/defender-investigation/
            !verification/defender-investigation/browser-*/edge-profile/
          if-no-files-found: error
          retention-days: 90

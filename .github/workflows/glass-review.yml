name: Glass finish review
on:
  push:
    branches: [codex/glass-finishes-review]
  workflow_dispatch:
    inputs:
      windows_client_only:
        description: Run just the Windows 11 comparison
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  moving-line:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(contains(github.event.head_commit.message, '[mac-rim]') && '["macos-26"]' || (inputs.windows_client_only || contains(github.event.head_commit.message, '[windows-client]')) && '["windows-11-arm"]' || '["macos-26","macos-15","macos-15-intel","windows-2025","windows-11-arm"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          architecture: ${{ runner.os == 'macOS' && matrix.os != 'macos-15-intel' && 'arm64' || 'x64' }}
          cache: pip
      - run: python -m pip install -r requirements-macos.txt pillow numpy
      - name: Prepare the disposable Windows client desktop
        if: matrix.os == 'windows-11-arm'
        run: |
          python -m pip install pywinauto==0.6.9
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m scripts.observed_process --directory verification/client-desktop/operation --label desktop --timeout 45 -- python -m scripts.client_download_check prepare --path verification/client-desktop --destination verification/client-desktop --output verification/client-desktop/ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m scripts.glass_client_desktop
      - name: Enable transparency on the disposable Mac
        if: runner.os == 'macOS'
        shell: bash
        run: |
          defaults read com.apple.universalaccess reduceTransparency || true
          defaults write com.apple.universalaccess reduceTransparency -bool false
          defaults -currentHost write com.apple.universalaccess reduceTransparency -bool false
          defaults write com.apple.Accessibility ReduceTransparencyEnabled -bool false
          defaults read com.apple.universalaccess reduceTransparency
          system_profiler SPDisplaysDataType
      - name: Identify the Windows graphics adapter
        if: runner.os == 'Windows'
        run: |
          Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion
          Get-CimInstance Win32_ComputerSystem | Select-Object Model
      - name: Run regression suite on the older Cocoa runtime
        if: matrix.os == 'macos-15'
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: '1'
        run: python -u -m scripts.run_tests
      - run: python -u -m scripts.glass_optics verification/glass
      - name: Photograph the rim against moving white lines
        if: matrix.os == 'macos-26'
        run: python -u -m scripts.glass_reel_review verification/glass/reel
      - name: Save the one-board optical evidence before interaction tests
        if: matrix.os == 'macos-26'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: board-optics
          path: verification/glass
      - name: Measure the current and review builds on the same desktop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3a515aa2d9f8c01b456d36d734b81ba21c1153f0
          path: baseline
          persist-credentials: false
      - run: python -u -m scripts.glass_benchmark baseline verification/glass/baseline.json White "Frosted Glass" "Liquid Glass" --idle-seconds ${{ matrix.os == 'windows-11-arm' && 12 || 4 }}
      - run: python -u -m scripts.glass_benchmark . verification/glass/candidate.json White "Frosted Glass" "Liquid Glass" --idle-seconds ${{ matrix.os == 'windows-11-arm' && 12 || 4 }}
      - run: python -u -m scripts.glass_controls_review verification/glass
      - name: Check native cross-process corner input and control geometry
        if: always() && matrix.os == 'windows-2025'
        run: |
          $failed = @()
          foreach ($scale in '1','1.25','1.5','2') {
            $env:QT_SCALE_FACTOR = $scale
            python -u -m scripts.surface_input_check --output "verification/glass/input-$scale"
            if ($LASTEXITCODE -ne 0) { $failed += $scale }
          }
          if ($failed.Count) { throw "Input check failed at scale $failed" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: glass-${{ matrix.os }}
          path: verification/glass
          if-no-files-found: warn

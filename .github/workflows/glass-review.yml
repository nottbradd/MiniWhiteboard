name: Glass finish review
on:
  push:
    branches: [codex/glass-finishes-review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  moving-line:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          architecture: ${{ runner.os == 'macOS' && 'arm64' || 'x64' }}
          cache: pip
      - run: python -m pip install -r requirements-macos.txt pillow numpy
      - name: Enable transparency on the disposable Mac
        if: runner.os == 'macOS'
        shell: bash
        run: |
          defaults read com.apple.universalaccess reduceTransparency || true
          defaults write com.apple.universalaccess reduceTransparency -bool false
          defaults -currentHost write com.apple.universalaccess reduceTransparency -bool false
          defaults write com.apple.Accessibility ReduceTransparencyEnabled -bool false
          defaults read com.apple.universalaccess reduceTransparency
          system_profiler SPDisplaysDataType
      - name: Identify the Windows graphics adapter
        if: runner.os == 'Windows'
        run: |
          Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion
          Get-CimInstance Win32_ComputerSystem | Select-Object Model
      - run: python -u -m scripts.glass_optics verification/glass
      - name: Measure the current and review builds on the same desktop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7b38b3ea6b6411159aacae4217bced7144cad1b6
          path: baseline
          persist-credentials: false
      - run: python -u -m scripts.glass_benchmark baseline verification/glass/baseline.json White Glass
      - run: python -u -m scripts.glass_benchmark . verification/glass/candidate.json White "Frosted Glass" "Liquid Glass"
      - run: python -u -m scripts.glass_controls_review verification/glass
      - name: Check native cross-process corner input and control geometry
        if: always() && matrix.os == 'windows-2025'
        run: python -u -m scripts.surface_input_check --output verification/glass/input
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: glass-${{ matrix.os }}
          path: verification/glass
          if-no-files-found: warn
